server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Самая важная часть: правило для обработки путей без расширений
    location / {
        # Пытаемся найти файл с указанным именем
        try_files $uri $uri.html $uri/ =404;
        
        # Если файл найден, но у него расширение .html, убираем расширение из URL в браузере
        # (опционально, для настоящего ЧПУ)
        if ($request_uri ~ ^/(.*)\.html$) {
            return 302 /$1;
        }
    }

    # Запрещаем доступ к любым скрытым файлам (например, .htaccess)
    location ~ /\. {
        deny all;
    }
}