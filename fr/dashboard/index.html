    function findTaskForImage(tasks, publicUrl, filePath) {
      if (!tasks || tasks.length === 0) return null;

      
      const normalizeUrl = (url) => {
        if (!url) return '';
        return decodeURIComponent(url.replace(/\/+$/, '').trim());
      };

      const normalizedPublicUrl = normalizeUrl(publicUrl);
      
      console.log(`🔍 Looking for task matching: ${normalizedPublicUrl}`);

      
      for (const task of tasks) {
        const taskUrl = normalizeUrl(task.input_image_url);
        
        
        if (taskUrl === normalizedPublicUrl) {
          console.log(`✅ Exact match found for task ${task.id}`);
          return task;
        }
        
        
        if (decodeURIComponent(taskUrl) === decodeURIComponent(normalizedPublicUrl)) {
          console.log(`✅ Decoded match found for task ${task.id}`);
          return task;
        }
        
        
        const taskFileName = taskUrl.split('/').pop();
        const currentFileName = normalizedPublicUrl.split('/').pop();
        if (taskFileName === currentFileName) {
          console.log(`✅ Filename match found for task ${task.id}`);
          return task;
        }
        
        
        const taskPath = taskUrl.split('/user-uploads/')[1];
        if (taskPath === filePath) {
          console.log(`✅ Storage path match found for task ${task.id}`);
          return task;
        }
      }
      
      console.log('❌ No matching task found using any strategy');
      return null;
    }

          setTimeout(() => checkTaskStatus(task.id, card, 1, 30), 1000);

        case 'success':
          
          const modelUrl = task.output_file_path || task.model_url || task.output;
          
          if (modelUrl && modelUrl.startsWith('http')) {
            updateSuccessStatus(statusContainer, modelUrl);
          } else {

                <div style="font-size: 0.7rem; margin-top: 0.3rem; color: #ccc;">
                  ID: ${task.id}
                </div>
              </div>
            `;

          generateBtn.textContent = '🔄 Regenerate';

        case 'failed':

              <div style="font-size: 0.7rem; margin-top: 0.3rem; color: #ccc;">
                ID: ${task.id}

    async function checkTaskStatus(requestId, card, attempt = 1, maxAttempts = 30) {
      try {
        console.log(`🔄 Checking task status: ${requestId}, attempt ${attempt}/${maxAttempts}`);
        
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
          console.log('❌ No session found');
          return;
        }

        const statusRes = await fetch(
          `${SUPABASE_URL}/functions/v1/get-task-status/${requestId}`,
          {
            headers: { 'Authorization': `Bearer ${session.access_token}` }
          }
        );

        console.log(`📊 Status response:`, statusRes.status, statusRes.statusText);

        if (!statusRes.ok) {
          const errorText = await statusRes.text();
          console.error(`❌ Status check failed:`, errorText);
          throw new Error(`HTTP ${statusRes.status}: ${statusRes.statusText}`);
        }

        const statusData = await statusRes.json();
        console.log(`🎯 Status data:`, statusData);
        
        const statusContainer = card.querySelector('.status-container');
        const generateBtn = card.querySelector('.generate-btn');

        if (!statusContainer) {
          console.error('❌ Status container not found in card');
          return;
        }

        
        switch (statusData.status) {
          case 'success':
            console.log(`✅ Task ${requestId} completed successfully`);
            
            
            try {
              const updateData = {
                status: 'success',
                updated_at: new Date().toISOString()
              };

              
              if (statusData.model_url || statusData.output_file_path) {
                const modelUrl = statusData.model_url || statusData.output_file_path;
                updateData.output = modelUrl;
                updateData.model_url = modelUrl;
                updateData.output_file_path = modelUrl;
                
                console.log(`💾 Saving model URL to database: ${modelUrl}`);
              } else {
                updateData.output = statusData.output || statusData.result;
                console.log('💾 Saving output data to database (no model URL)');
              }

              const { error: updateError } = await supabase
                .from('generation_tasks')
                .update(updateData)
                .eq('id', requestId);

              if (updateError) {
                console.error('❌ Database update error:', updateError);
              } else {
                console.log('✅ Successfully updated task in database');
              }
            } catch (dbError) {
              console.error('💥 Database error:', dbError);
            }

            
            if (statusData.model_url || statusData.output_file_path) {
              const modelUrl = statusData.model_url || statusData.output_file_path;
              updateSuccessStatus(statusContainer, modelUrl);
            } else {
              statusContainer.innerHTML = `
                <div class="status-success">
                  ✅ Generation completed
                  <div style="font-size: 0.7rem; margin-top: 0.3rem; color: #ccc;">
                    No model URL provided
                  </div>
                  <div style="font-size: 0.7rem; margin-top: 0.3rem; color: #ccc;">
                    Output: ${statusData.output || statusData.result}
                  </div>
                </div>
              `;
            }
            if (generateBtn) {
              generateBtn.disabled = false;
              generateBtn.textContent = '🔄 Regenerate';
            }
            break;

          case 'processing':
          case 'starting':
            console.log(`⏳ Task ${requestId} still processing`);
            if (attempt >= maxAttempts) {
              statusContainer.innerHTML = `
                <div class="status-error">
                  ⏰ Timeout: Generation taking too long
                  <div style="font-size: 0.7rem; margin-top: 0.3rem; color: #fca5a5;">
                    Request ID: ${requestId}
                  </div>
                </div>
              `;
              if (generateBtn) generateBtn.disabled = false;
            } else {
              statusContainer.innerHTML = `
                <div class="status-processing">
                  ⏳ Processing... (${attempt}/${maxAttempts})
                  <div style="font-size: 0.7rem; margin-top: 0.3rem; color: #f59e0b;">
                    Request ID: ${requestId}
                  </div>
                </div>
              `;
              
              try {
                await supabase
                  .from('generation_tasks')
                  .update({
                    status: statusData.status,
                    updated_at: new Date().toISOString()
                  })
                  .eq('id', requestId);
              } catch (dbError) {
                console.error('Database update error:', dbError);
              }
              
              
              setTimeout(() => checkTaskStatus(requestId, card, attempt + 1, maxAttempts), 5000);
            }
            break;

          case 'failed':
          case 'error':
            console.error(`❌ Task ${requestId} failed:`, statusData.result || statusData.output);
            
            
            try {
              await supabase
                .from('generation_tasks')
                .update({
                  status: 'failed',
                  output: statusData.output || statusData.result || 'Unknown error',
                  updated_at: new Date().toISOString()
                })
                .eq('id', requestId);
            } catch (dbError) {
              console.error('Database update error:', dbError);
            }
            
            statusContainer.innerHTML = `
              <div class="status-error">
                ❌ Generation failed
                <div style="font-size: 0.7rem; margin-top: 0.3rem; color: #fca5a5;">
                  ${statusData.output || statusData.result || 'Unknown error'}
                </div>
                <div style="font-size: 0.7rem; margin-top: 0.3rem; color: #ccc;">
                  Request ID: ${requestId}
                </div>
              </div>
            `;
            if (generateBtn) {
              generateBtn.disabled = false;
              generateBtn.textContent = '🔄 Try Again';
            }
            break;

          default:
            console.warn(`❓ Unknown status for task ${requestId}:`, statusData.status);
            statusContainer.innerHTML = `
              <div class="status-info">
                ❓ Unknown status: ${statusData.status}
                <div style="font-size: 0.7rem; margin-top: 0.3rem; color: #ccc;">
                  Request ID: ${requestId}
                </div>
              </div>
            `;
            if (generateBtn) generateBtn.disabled = false;
        }

      } catch (error) {
        console.error(`💥 Error checking task ${requestId}:`, error);
        const statusContainer = card.querySelector('.status-container');
        const generateBtn = card.querySelector('.generate-btn');
        
        if (statusContainer) {
          statusContainer.innerHTML = `
            <div class="status-error">
              ❌ Error checking status
              <div style="font-size: 0.7rem; margin-top: 0.3rem; color: #fca5a5;">
                ${error.message}
              </div>
              <div style="font-size: 0.7rem; margin-top: 0.3rem; color: #ccc;">
                Request ID: ${requestId}
              </div>
            </div>
          `;
        }
        
        if (generateBtn) generateBtn.disabled = false;
      }
    }

    
    function updateSuccessStatus(statusContainer, modelUrl) {
      if (modelUrl && modelUrl.startsWith('http')) {
        
        const fileExtension = modelUrl.split('.').pop().toLowerCase();
        const is3DFormat = ['glb', 'gltf', 'obj', 'stl', 'fbx'].includes(fileExtension);
        
        statusContainer.innerHTML = `
          <div class="status-success">
            ✅ 3D Model Ready!
            <div style="margin-top: 0.5rem;">
              <a href="${modelUrl}" class="model-link" target="_blank" download="model.${fileExtension}">
                📥 Download ${is3DFormat ? fileExtension.toUpperCase() : 'File'}
              </a>
              <button onclick="preview3DModel('${modelUrl}')" class="model-link" style="background: #7c3aed; border: none; cursor: pointer;">
                👀 Preview
              </button>
            </div>
            <div style="font-size: 0.7rem; margin-top: 0.5rem; color: #ccc;">
              <a href="${modelUrl}" target="_blank" style="color: #ccc; text-decoration: underline;">
                Direct link
              </a>
            </div>
          </div>
        `;
      } else {
        statusContainer.innerHTML = `
          <div class="status-success">
            ✅ Generation completed
            <div style="font-size: 0.7rem; margin-top: 0.3rem; color: #ccc;">
              Output: ${modelUrl || 'No URL provided'}
            </div>
          </div>
        `;
      }
    }

    
    function handleModelNotFoundError(statusContainer, modelUrl, taskId) {
      console.error(`❌ Model not found at: ${modelUrl}`);
      
      statusContainer.innerHTML = `
        <div class="status-error">
          ❌ 3D Model File Not Found
          <div style="font-size: 0.7rem; margin-top: 0.3rem; color: #fca5a5;">
            The generated 3D model file could not be found at the expected location.
          </div>
          <div style="font-size: 0.7rem; margin-top: 0.3rem; color: #ccc;">
            Expected URL: ${modelUrl}
          </div>
          <div style="font-size: 0.7rem; margin-top: 0.3rem; color: #ccc;">
            Task ID: ${taskId}
          </div>
          <div style="margin-top: 0.5rem;">
            <button onclick="retryGeneration('${taskId}')" class="model-link" style="background: #dc2626; border: none; cursor: pointer;">
              🔄 Retry Generation
            </button>
          </div>
        </div>
      `;
    }

    
    async function handleGeneration(filePath, publicUrl, card) {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        alert('Not authenticated');
        return;
      }

      const statusContainer = card.querySelector('.status-container');
      const generateBtn = card.querySelector('.generate-btn');
      
      if (!statusContainer || !generateBtn) {
        console.error('Required DOM elements not found');
        return;
      }

      statusContainer.innerHTML = '<div class="status-processing">🚀 Starting 3D generation...</div>';
      generateBtn.disabled = true;

      try {
        console.log(`🚀 Sending generation request for: ${publicUrl}`);
        
        const response = await fetch(`${SUPABASE_URL}/functions/v1/start-generation`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${session.access_token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ image_url: publicUrl })
        });

        const result = await response.json();
        console.log('📦 Generation response:', result);
        
        if (!response.ok) {
          throw new Error(result.error || `HTTP ${response.status}: Generation failed`);
        }

        console.log(`🎯 Generation started with request ID: ${result.request_id}`);
        
        statusContainer.innerHTML = `
          <div class="status-processing">
            ⏳ Processing 3D model...
            <div style="font-size: 0.7rem; margin-top: 0.3rem; color: #f59e0b;">
              Request ID: ${result.request_id}
            </div>
          </div>
        `;
        
        
        setTimeout(async () => {
          const { data: task } = await supabase
            .from('generation_tasks')
            .select('*')
            .eq('id', result.request_id)
            .single();
          
          console.log('💾 Task saved in database:', task);
        }, 1000);
        
        
        setTimeout(() => checkTaskStatus(result.request_id, card, 1, 30), 3000);

      } catch (err) {
        console.error('❌ Generation error:', err);
        statusContainer.innerHTML = `
          <div class="status-error">
            ❌ Error: ${err.message}
            <div style="font-size: 0.7rem; margin-top: 0.3rem; color: #fca5a5;">
              Please try again
            </div>
          </div>
        `;
        generateBtn.disabled = false;
      }
    }

    
    async function handleDelete(filePath, publicUrl) {
      if (!confirm('Are you sure you want to delete this image and all associated generation data?')) return;
      
      try {
        const { error: storageError } = await supabase.storage.from('user-uploads').remove([filePath]);
        
        if (storageError) {
          throw new Error(`Storage error: ${storageError.message}`);
        }
        
        
        const { error: taskError } = await supabase
          .from('generation_tasks')
          .delete()
          .eq('input_image_url', publicUrl);
        
        if (taskError) {
          console.error('Error deleting task:', taskError);
        }
        
        console.log(`✅ Successfully deleted: ${filePath}`);
        loadUserImages(); 
        
      } catch (error) {
        console.error('❌ Error deleting file:', error);
        alert(`Error deleting image: ${error.message}`);
      }
    }

    
    async function refreshAllTasksStatus() {
      console.log('🔄 Manually refreshing all task statuses');
      const cards = document.querySelectorAll('.image-card');
      
      for (const card of cards) {
        const taskId = card.dataset.taskId;
        const currentStatus = card.dataset.taskStatus;
        
        if (taskId && (currentStatus === 'processing' || currentStatus === 'starting')) {
          const generateBtn = card.querySelector('.generate-btn');
          const statusContainer = card.querySelector('.status-container');
          
          if (generateBtn && statusContainer) {
            generateBtn.disabled = true;
            statusContainer.innerHTML = '<div class="status-processing">🔄 Refreshing status...</div>';
            setTimeout(() => checkTaskStatus(taskId, card, 1, 5), 500);
          }
        }
      }
    }

    
    async function syncAllImagesWithTasks() {
      console.log('🔄 Starting sync of all images with tasks');
      
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;

      const userId = session.user.id;
      
      
      const { data: allTasks, error: tasksError } = await supabase
        .from('generation_tasks')
        .select('*')
        .eq('user_id', userId);

      if (tasksError) {
        console.error('❌ Error loading tasks:', tasksError);
        return;
      }

      console.log(`📋 Found ${allTasks?.length || 0} total tasks for user`);

      
      const cards = document.querySelectorAll('.image-card');
      cards.forEach(card => {
        const filePath = card.dataset.filePath;
        if (!filePath) return;

        const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/user-uploads/${filePath}`;
        const statusContainer = card.querySelector('.status-container');
        const generateBtn = card.querySelector('.generate-btn');

        if (!statusContainer || !generateBtn) return;

        
        const task = allTasks?.find(t => {
          const normalizeUrl = (url) => url?.replace(/\/+$/, '').trim() || '';
          return normalizeUrl(t.input_image_url) === normalizeUrl(publicUrl);
        });

        if (task) {
          console.log(`✅ Found task for ${filePath}:`, task.id, task.status);
          card.dataset.taskId = task.id;
          card.dataset.taskStatus = task.status;

          
          if (task.status === 'processing' || task.status === 'starting') {
            generateBtn.disabled = true;
            statusContainer.innerHTML = '<div class="status-processing">⏳ Checking status...</div>';
            setTimeout(() => checkTaskStatus(task.id, card, 1, 30), 1000);
          } else if (task.status === 'success' && task.output) {
            updateSuccessStatus(statusContainer, task.output);
            generateBtn.disabled = false;
            generateBtn.textContent = '🔄 Regenerate';
          } else if (task.status === 'failed' || task.status === 'error') {
            statusContainer.innerHTML = `<div class="status-error">❌ Generation failed</div>`;
            generateBtn.disabled = false;
            generateBtn.textContent = '🔄 Try Again';
          }
        } else {
          console.log(`❌ No task found for ${filePath}`);
        }
      });
    }

    
    async function checkRLSAccess() {
      console.log('🔐 Checking RLS access to generation_tasks table...');
      
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        console.log('❌ No session for RLS check');
        return;
      }

      const userId = session.user.id;
      
      
      console.log('🧪 Test 1: Loading all tasks for user');
      const { data: allTasks, error: allError } = await supabase
        .from('generation_tasks')
        .select('*')
        .eq('user_id', userId);

      if (allError) {
        console.error('❌ Test 1 FAILED - RLS issue?', allError);
      } else {
        console.log(`✅ Test 1 PASSED - Found ${allTasks?.length || 0} tasks`);
      }

      
      console.log('🧪 Test 2: Loading specific task by ID');
      const { data: specificTask, error: specificError } = await supabase
        .from('generation_tasks')
        .select('*')
        .eq('id', '28585726')
        .single();

      if (specificError) {
        console.error('❌ Test 2 FAILED - RLS issue?', specificError);
      } else {
        console.log('✅ Test 2 PASSED - Specific task loaded:', specificTask);
      }

      
      console.log('🧪 Test 3: Testing INSERT permission');
      const testTaskId = 'test-' + Date.now();
      const { error: insertError } = await supabase
        .from('generation_tasks')
        .insert({
          id: testTaskId,
          user_id: userId,
          input_image_url: 'https://example.com/test.jpg',
          status: 'testing'
        });

      if (insertError) {
        console.error('❌ Test 3 FAILED - INSERT RLS issue?', insertError);
      } else {
        console.log('✅ Test 3 PASSED - INSERT permission granted');
        
        
        await supabase
          .from('generation_tasks')
          .delete()
          .eq('id', testTaskId);
      }
    }

    
    async function forceLoadKnownTasks() {
      console.log('🔧 Force loading known tasks...');
      
      const knownTaskIds = ['28585726']; 
      
      for (const taskId of knownTaskIds) {
        try {
          const { data: task, error } = await supabase
            .from('generation_tasks')
            .select('*')
            .eq('id', taskId)
            .single();

          if (error) {
            console.error(`❌ Failed to load task ${taskId}:`, error);
          } else if (task) {
            console.log(`✅ Loaded known task ${taskId}:`, task);
            
            
            const cards = document.querySelectorAll('.image-card');
            for (const card of cards) {
              const filePath = card.dataset.filePath;
              if (!filePath) continue;

              const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/user-uploads/${filePath}`;
              
              
              if (task.input_image_url === publicUrl) {
                console.log(`🎯 Found matching card for task ${taskId}`);
                card.dataset.taskId = task.id;
                card.dataset.taskStatus = task.status;
                updateCardStatus(card, task);
                break;
              }
            }
          }
        } catch (ex) {
          console.error(`💥 Exception loading task ${taskId}:`, ex);
        }
      }
    }

    
    


    
    window.retryGeneration = async function(taskId) {
      console.log(`🔄 Retrying generation for task: ${taskId}`);
      
      
      const card = document.querySelector(`[data-task-id="${taskId}"]`);
      if (!card) {
        alert('Card not found for this task');
        return;
      }
      
      const filePath = card.dataset.filePath;
      const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/user-uploads/${filePath}`;
      
      
      await handleGeneration(filePath, publicUrl, card);
    };

    
    signinBtn?.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email || !email.includes('@')) {
        authStatus.textContent = 'Please enter a valid email.';
        authStatus.style.color = '#ff6b6b';
        return;
      }
      authStatus.textContent = 'Sending magic link...';
      const redirectUrl = window.location.origin + '/dashboard/';
      const { error } = await supabase.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectUrl } });
      authStatus.textContent = error ? `Error: ${error.message}` : '✅ Check your email!';
      authStatus.style.color = error ? '#ff6b6b' : '#4caf50';
    });

    signoutBtn?.addEventListener('click', async () => {
      await supabase.auth.signOut();
      checkSession();
    });

    
    imageUpload?.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      uploadStatus.textContent = 'Uploading...';
      uploadStatus.style.color = '#4caf50';

      const { data: { session }, error: authError } = await supabase.auth.getSession();
      if (authError || !session) {
        uploadStatus.textContent = 'Authentication required.';
        uploadStatus.style.color = '#ff6b6b';
        return;
      }

      const userId = session.user.id;
      const fileName = `${Date.now()}-${file.name.replace(/\s+/g, '-')}`;
      const filePath = `${userId}/${fileName}`;

      const { error: uploadError } = await supabase
        .storage
        .from('user-uploads')
        .upload(filePath, file);

      if (uploadError) {
        uploadStatus.textContent = 'Upload failed: ' + uploadError.message;
        uploadStatus.style.color = '#ff6b6b';
      } else {
        uploadStatus.textContent = '✅ Image uploaded!';
        uploadStatus.style.color = '#4caf50';
        loadUserImages(); 
      }
      
      
      e.target.value = '';
    });

    
    refreshAllBtn?.addEventListener('click', refreshAllTasksStatus);
    syncAllBtn?.addEventListener('click', syncAllImagesWithTasks);
    rlsCheckBtn?.addEventListener('click', checkRLSAccess);

    
    checkSession();
  </script>

</body>
</html>
