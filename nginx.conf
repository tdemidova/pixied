server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Основное правило для обработки путей
    location / {
        # Пытаемся найти файл с указанным именем
        try_files $uri $uri.html $uri/ =404;
    }

    # Специальное правило для обработки явных .html запросов
    location ~ \.html$ {
        try_files $uri =404;
        
        # Добавляем заголовки, отключающие кэширование
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Запрещаем доступ к скрытым файлам
    location ~ /\. {
        deny all;
    }

    # Убираем расширение .html из URL (опционально)
    if ($request_uri ~ ^/(.*)\.html$) {
        return 302 /$1;
    }
}